[package]
name = "nuprompt"
version = "0.5.1"
rust-version = "1.88.0"
description = "A personal bash prompt."
repository = "https://github.com/astromechza/nuprompt"
edition = "2024"
license-file = "LICENSE"
categories = ["command-line-interface"]
keywords = ["prompt"]
include = [
    "**/*.rs",
    "Cargo.toml",
    "Cargo.lock",
    "LICENSE",
    "README.md",
]

[dependencies]
# gix is pre-1.0 with API churn, so pin the exact version. default-features are
# disabled to keep the dependency tree small; "max-performance-safe" gives the
# faster pure-Rust code paths without any C toolchain (no zlib-ng), and "status"
# pulls in the worktree/index dirwalk we need.
gix = { version = "=0.87.1", default-features = false, features = ["status", "max-performance-safe", "sha1"] }
users = { version = "0.11.0", default-features = false }
log = { version = "0.4.34", default-features = false }
env_logger = { version = "0.11.11", default-features = false }
anyhow = { version = "1.0.104", default-features = false }
coarsetime = { version = "0.1.37", default-features = false }
termcolor = { version = "1.4.1", default-features = false }
